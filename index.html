<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Service - ระบบแจ้งซ่อมออนไลน์</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
    body {
      margin: 0;
      padding: 28px 16px;
      background: #f1f5f9;
      display: flex;
      justify-content: center;
    }
    .card {
      width: 100%;
      max-width: 600px;
      background: #ffffff;
      border-top: 6px solid #1d4ed8;
      border-radius: 16px;
      padding: 32px 28px;
      box-shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
    }
    .header-icon {
      text-align: center;
      color: #1d4ed8;
      font-size: 2.2rem;
      margin-bottom: 10px;
    }
    h1 {
      margin: 0 0 28px;
      text-align: center;
      color: #1e3a8a;
      font-size: 1.6rem;
      font-weight: 700;
    }
    .form-group { margin-bottom: 18px; }
    label {
      display: block;
      margin-bottom: 7px;
      font-weight: 600;
      color: #1e293b;
      font-size: 0.95rem;
    }
    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }
    .input-icon {
      position: absolute;
      left: 14px;
      color: #64748b;
      pointer-events: none;
    }
    .input-wrap input {
      width: 100%;
      padding: 11px 14px 11px 40px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 0.95rem;
      min-height: 95px;
      resize: vertical;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input:focus, textarea:focus {
      border-color: #1d4ed8;
      box-shadow: 0 0 0 3px rgba(29, 78, 216, 0.12);
    }
    input[type="file"] {
      width: 100%;
      padding: 9px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      background: #f8fafc;
      font-size: 0.9rem;
    }
    .hint {
      font-size: 0.8rem;
      color: #64748b;
      margin-top: 5px;
    }
    button {
      width: 100%;
      padding: 13px;
      background: #1d4ed8;
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.2s;
    }
    button:hover { background: #1e40af; }
    button:disabled { background: #94a3b8; cursor: not-allowed; }
    .status {
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: 10px;
      display: none;
      font-size: 0.92rem;
    }
    .status.success { display: block; background: #dcfce7; color: #166534; }
    .status.error { display: block; background: #fee2e2; color: #991b1b; }
  </style>
</head>
<body>
  <div class="card">
    <div class="header-icon"><i class="fa-solid fa-screwdriver-wrench"></i></div>
    <h1>ระบบแจ้งซ่อมออนไลน์</h1>

    <form id="repairForm">
      <div class="form-group">
        <label for="hospital">โรงพยาบาล (Hospital)</label>
        <div class="input-wrap">
          <i class="fa-regular fa-hospital input-icon"></i>
          <input type="text" id="hospital" placeholder="ระบุชื่อโรงพยาบาล" required />
        </div>
      </div>

      <div class="form-group">
        <label for="contactName">ชื่อผู้ติดต่อ (Contact Name)</label>
        <div class="input-wrap">
          <i class="fa-regular fa-user input-icon"></i>
          <input type="text" id="contactName" placeholder="ชื่อ-นามสกุล" required />
        </div>
      </div>

      <div class="form-group">
        <label for="contactPhone">เบอร์โทรติดต่อ (Phone)</label>
        <div class="input-wrap">
          <i class="fa-solid fa-phone input-icon"></i>
          <input type="tel" id="contactPhone" placeholder="08X-XXX-XXXX" required />
        </div>
      </div>

      <div class="form-group">
        <label for="equipment">ชื่อรุ่น/อุปกรณ์ (Equipment)</label>
        <div class="input-wrap">
          <i class="fa-solid fa-cubes input-icon"></i>
          <input type="text" id="equipment" placeholder="ระบุชื่ออุปกรณ์หรือรุ่น" required />
        </div>
      </div>

      <div class="form-group">
        <label for="serialNumber">หมายเลขเครื่อง (Serial Number)</label>
        <div class="input-wrap">
          <i class="fa-solid fa-barcode input-icon"></i>
          <input type="text" id="serialNumber" placeholder="S/N" required />
        </div>
      </div>

      <div class="form-group">
        <label for="problem">อาการเสียเบื้องต้น (Problem)</label>
        <textarea id="problem" placeholder="อธิบายอาการที่พบ" required></textarea>
      </div>

      <div class="form-group">
        <label for="reportDate">วันที่แจ้ง (Report Date)</label>
        <div class="input-wrap">
          <i class="fa-regular fa-calendar input-icon"></i>
          <input type="date" id="reportDate" required />
        </div>
      </div>

      <div class="form-group">
        <label for="engineer">วิศวกรที่รับผิดชอบ (Engineer) - ตัวเลือก</label>
        <div class="input-wrap">
          <i class="fa-solid fa-user-gear input-icon"></i>
          <input type="text" id="engineer" placeholder="หากทราบสามารถระบุได้ (เว้นว่างได้)" />
        </div>
      </div>

      <div class="form-group">
        <label for="imageFile">แนบรูปภาพประกอบ (Image)</label>
        <input type="file" id="imageFile" accept="image/*" />
        <div class="hint">รองรับไฟล์รูปภาพเท่านั้น</div>
      </div>

      <button type="submit" id="submitBtn">
        <i class="fa-regular fa-paper-plane"></i>
        <span>ยืนยันการแจ้งซ่อม</span>
      </button>
      <div id="statusBox" class="status"></div>
    </form>
  </div>

  <script>
    const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxsUAaSO-aeaLWJRYLCUVziQuuhVZCi95l-EJUUulbNoxE5kq8f2Q6EgK1vDePYfKe-pQ/exec';

    document.getElementById('reportDate').valueAsDate = new Date();

    function readFileAsBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
          const base64Data = reader.result.split(',')[1];
          resolve({
            name: file.name,
            type: file.type,
            data: base64Data
          });
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    document.getElementById('repairForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const statusBox = document.getElementById('statusBox');

      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> <span>กำลังส่งข้อมูล...</span>';
      statusBox.className = 'status';
      statusBox.style.display = 'none';

      try {
        const fileInput = document.getElementById('imageFile');
        let imageFileObj = null;
        if (fileInput.files && fileInput.files[0]) {
          imageFileObj = await readFileAsBase64(fileInput.files[0]);
        }

        const payload = {
          hospital: document.getElementById('hospital').value.trim(),
          contactName: document.getElementById('contactName').value.trim(),
          contactPhone: document.getElementById('contactPhone').value.trim(),
          equipment: document.getElementById('equipment').value.trim(),
          serialNumber: document.getElementById('serialNumber').value.trim(),
          problem: document.getElementById('problem').value.trim(),
          reportDate: document.getElementById('reportDate').value,
          engineer: document.getElementById('engineer').value.trim(),
          ibdate: "",
          expirydate: "",
          imageFile: imageFileObj
        };

        const response = await fetch(GAS_WEB_APP_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });

        const result = await response.json();
        if (result.status === 'success') {
          statusBox.textContent = result.message || 'บันทึกข้อมูลและแจ้งเตือนเรียบร้อยแล้ว';
          statusBox.className = 'status success';
          e.target.reset();
          document.getElementById('reportDate').valueAsDate = new Date();
        } else {
          throw new Error(result.message || 'เกิดข้อผิดพลาดในการบันทึกข้อมูล');
        }
      } catch (err) {
        statusBox.textContent = 'ส่งข้อมูลไม่สำเร็จ: ' + err.message;
        statusBox.className = 'status error';
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-regular fa-paper-plane"></i> <span>ยืนยันการแจ้งซ่อม</span>';
      }
    });
  </script>
</body>
</html>
